name: Build and Push

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name"
        required: true
        default: "acc"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/${{ github.event.inputs.name }}
          file: ${{ github.workspace }}/${{ github.event.inputs.name }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.inputs.name }}-latest
